services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # network_mode: host (découvert nécessaire à l'usage, pas anticipé à la
    # conception) : chaque service backend publie son port HTTP sur
    # 127.0.0.1:PORT (contrat d'intégration, _plan/architecture.md). Un socket
    # lié explicitement à 127.0.0.1 n'accepte QUE les connexions arrivant par
    # la loopback — pas celles arrivant via la passerelle d'un réseau bridge
    # Docker (ce que donnait host.docker.internal:host-gateway, essayé en
    # premier : 502 Bad Gateway systématique). En network_mode: host, ce
    # conteneur partage directement l'espace réseau de l'hôte : 127.0.0.1 y
    # désigne réellement la loopback de l'hôte, exactement comme le ferait un
    # client externe qui se connecterait localement. Pas de "ports:" avec ce
    # mode : nginx écoute le 443 directement sur l'hôte via sa propre config.
    network_mode: host
    volumes:
      # nginx.conf personnalisé (ajout du bloc stream {} pour le port de jeu
      # Minecraft, cf. minecraft/CLAUDE.md) — reprend fidèlement le
      # nginx.conf par défaut de l'image nginx:1.27-alpine, rien retiré côté
      # http {}, voir le fichier lui-même pour le détail.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/stream.d:/etc/nginx/stream.d:ro
      - ./nginx/error-pages:/etc/nginx/error-pages:ro
      # Snippets réutilisables inclus par certains conf.d/*.conf (pattern
      # forward-auth authentik, authentik/_plan/plan.md phase 3) — un seul
      # exemplaire de la logique, pas un copier-coller par service protégé.
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certs:/etc/nginx/certs:ro
    # Reload périodique : nginx ne relit jamais un certificat déjà chargé sans
    # signal explicite. sidecar-acme n'a aucun moyen d'atteindre ce conteneur
    # (pas de docker.sock partagé, volontairement, pour rester isolé) : on
    # recharge donc nginx nous-mêmes toutes les 6h pour reprendre tout
    # certificat renouvelé entre-temps. Un reload nginx est sans coupure.
    # (Pattern identique à bitwarden/compose.yaml — même raisonnement.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (
          while true; do
            sleep 21600
            nginx -s reload 2>/dev/null || true
          done
        ) &
        exec nginx -g 'daemon off;'

  # sidecar-acme : obtient/renouvelle les certificats Let's Encrypt via
  # challenge DNS-01 (dynv6, seul fournisseur depuis le retrait de DuckDNS —
  # edge/_plan/plan.md phase 15, migration terminée 2026-08-24), un par
  # sous-domaine. `command: daemon` exécute le cron interne d'acme.sh
  # (vérification quotidienne, renouvellement si <30j de validité restante,
  # puis ré-exécution automatique de l'action --install-cert enregistrée
  # lors de l'émission initiale). L'émission initiale de chaque sous-domaine
  # se fait manuellement une fois (--dns dns_dynv6), voir README.md.
  sidecar-acme:
    image: neilpang/acme.sh:latest
    profiles: ["dynv6"]
    restart: unless-stopped
    environment:
      DYNV6_TOKEN: "${DYNV6_TOKEN}"
    volumes:
      - acme_state:/acme.sh
      - certs:/certs
    command: daemon

  # sidecar-ddns-dynv6 : équivalent dynv6 de sidecar-ddns ci-dessus, cf.
  # _plan/plan.md phase 15 (migration DuckDNS -> dynv6, coexistence pendant
  # la transition via un profil Compose séparé, "dynv6").
  #
  # Découverte réelle (2026-08-23), en deux temps :
  # 1) L'interface dynv6 génère systématiquement un nom cible distinct par
  #    service ajouté (ex. "vault" -> CNAME vers "vaultwarden.jvince.dynv6.net")
  #    plutôt que de permettre facilement un CNAME vers un enregistrement déjà
  #    existant — schéma "un enregistrement par service" adopté plutôt que de
  #    lutter contre l'UI (chaque nom court, "vault"/"task"/etc., n'est qu'un
  #    CNAME statique créé une fois pour toutes dans l'UI, jamais touché ici).
  # 2) L'endpoint simplifié "/api/update?hostname=..." (utilisé par
  #    sidecar-ddns pour DuckDNS, tenté ici par analogie) ne fonctionne QUE
  #    pour l'adresse propre de la zone elle-même (son "nom de zone",
  #    jvince.dynv6.net) — HTTP 404 sur tout autre enregistrement, MÊME s'il
  #    existe réellement (vérifié : un enregistrement créé dans l'UI, visible
  #    en DNS public, renvoie quand même 404 via cet endpoint). Le même token
  #    fonctionne en revanche pleinement via l'API REST v2 de dynv6 (Bearer
  #    token, GET/PATCH par ID d'enregistrement) — c'est ce qu'utilise en
  #    réalité le plugin dns_dynv6 d'acme.sh sous le capot, ce qui explique
  #    pourquoi le test ACME a réussi alors que l'endpoint simplifié échouait
  #    pour les mêmes noms. Ce sidecar utilise donc l'API REST v2 : une
  #    requête GET liste tous les enregistrements de la zone (avec leur ID),
  #    puis un PATCH par ID met à jour le contenu.
  #
  # DYNV6_HOSTNAMES / DYNV6_HOSTNAMES_V6ONLY : listes de noms COURTS (pas de
  # FQDN, ex. "vaultwarden", pas "vaultwarden.jvince.dynv6.net" — c'est le
  # champ "name" tel que renvoyé par l'API), décalque de DUCKDNS_SUBDOMAINS /
  # DUCKDNS_SUBDOMAINS_V6ONLY :
  # - DYNV6_HOSTNAMES : A factice (192.0.2.1) + AAAA réel, pour les services
  #   consommés par un client avec bascule IPv4/IPv6 (Happy Eyeballs -
  #   navigateur, app mobile standard). Chaque nom doit déjà avoir ses deux
  #   enregistrements A et AAAA créés manuellement dans l'UI dynv6.
  # - DYNV6_HOSTNAMES_V6ONLY : AAAA seul, aucun enregistrement A du tout,
  #   jamais créé ni touché par ce sidecar (même piège que DuckDNS Phase 13)
  #   — pour minecraft (client Minecraft Java, sans cette bascule).
  sidecar-ddns-dynv6:
    image: alpine:3.20
    profiles: ["dynv6"]
    restart: unless-stopped
    network_mode: host
    environment:
      DYNV6_HOSTNAMES: "${DYNV6_HOSTNAMES:-}"
      DYNV6_HOSTNAMES_V6ONLY: "${DYNV6_HOSTNAMES_V6ONLY:-}"
      DYNV6_TOKEN: "${DYNV6_TOKEN}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl jq >/dev/null
        if [ -z "$${DYNV6_HOSTNAMES}" ] && [ -z "$${DYNV6_HOSTNAMES_V6ONLY}" ]; then
          echo "DYNV6_HOSTNAMES et DYNV6_HOSTNAMES_V6ONLY sont vides, rien à mettre à jour." >&2
          exit 1
        fi
        API="https://dynv6.com/api/v2"
        echo "sidecar-ddns-dynv6 démarré pour: $${DYNV6_HOSTNAMES} (A+AAAA) / $${DYNV6_HOSTNAMES_V6ONLY} (AAAA seul)"
        patch_record() {
          id="$$1"; data="$$2"; label="$$3"
          CODE=$$(curl -fsS -m 10 -o /tmp/resp -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $${DYNV6_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"data\":\"$${data}\"}" "$${API}/zones/$${ZONE_ID}/records/$${id}") || CODE="000"
          if [ "$$CODE" = "200" ]; then
            echo "$$(date -u +%FT%TZ) dynv6 mis à jour ($${label}): $${data}"
          else
            echo "$$(date -u +%FT%TZ) échec mise à jour dynv6 ($${label}, id $${id}), HTTP $$CODE: $$(cat /tmp/resp 2>/dev/null)" >&2
          fi
        }
        find_id() {
          echo "$$RECORDS" | jq -r --arg n "$$1" --arg t "$$2" '[.[] | select(.type==$$t and .name==$$n)][0].id // ""'
        }
        while true; do
          IPV6=$$(curl -6 -fsS -m 10 https://api6.ipify.org || echo "")
          if [ -z "$$IPV6" ]; then
            echo "$$(date -u +%FT%TZ) impossible de déterminer l'IPv6 publique (pas de connectivité IPv6 sortante ?)" >&2
          else
            ZONE_ID=$$(curl -fsS -m 10 -H "Authorization: Bearer $${DYNV6_TOKEN}" "$${API}/zones" | jq -r '.[0].id') || ZONE_ID=""
            if [ -z "$$ZONE_ID" ] || [ "$$ZONE_ID" = "null" ]; then
              echo "$$(date -u +%FT%TZ) impossible de récupérer la zone dynv6 (réseau/API indisponible ?), on réessaiera au prochain cycle" >&2
            else
              RECORDS=$$(curl -fsS -m 10 -H "Authorization: Bearer $${DYNV6_TOKEN}" "$${API}/zones/$${ZONE_ID}/records") || RECORDS=""
              if [ -z "$$RECORDS" ]; then
                echo "$$(date -u +%FT%TZ) impossible de récupérer les enregistrements dynv6, on réessaiera au prochain cycle" >&2
              else
                OLDIFS="$$IFS"; IFS=','
                for name in $${DYNV6_HOSTNAMES}; do
                  [ -z "$$name" ] && continue
                  AID=$$(find_id "$$name" "A")
                  QID=$$(find_id "$$name" "AAAA")
                  if [ -n "$$AID" ]; then patch_record "$$AID" "192.0.2.1" "$$name/A"; else echo "$$(date -u +%FT%TZ) pas de A trouvé pour $$name" >&2; fi
                  if [ -n "$$QID" ]; then patch_record "$$QID" "$$IPV6" "$$name/AAAA"; else echo "$$(date -u +%FT%TZ) pas de AAAA trouvé pour $$name" >&2; fi
                done
                for name in $${DYNV6_HOSTNAMES_V6ONLY}; do
                  [ -z "$$name" ] && continue
                  QID=$$(find_id "$$name" "AAAA")
                  if [ -n "$$QID" ]; then patch_record "$$QID" "$$IPV6" "$$name/AAAA v6-only"; else echo "$$(date -u +%FT%TZ) pas de AAAA trouvé pour $$name (v6-only)" >&2; fi
                done
                IFS="$$OLDIFS"
              fi
            fi
          fi
          sleep 300
        done

  # Conteneur ponctuel : génère les certificats auto-signés nécessaires aux
  # blocs nginx qui n'ont pas (encore) de certificat Let's Encrypt — le bloc
  # de test par défaut (_test) depuis la Phase 0, et tout service en mode
  # "local uniquement" qui a besoin malgré tout d'un contexte HTTPS (voir
  # correction ci-dessous). Ne tourne jamais en continu — s'exécute via :
  #   docker compose run --rm cert-init
  #
  # Correction découverte à l'usage (2026-08-13, actual-budget) : un service
  # "local uniquement" servi en HTTP simple (sans certificat) ne suffit pas
  # toujours — un navigateur ne considère "contexte sécurisé" que HTTPS ou
  # localhost/127.0.0.1, et certaines apps web (Actual, via SharedArrayBuffer)
  # exigent ce contexte sécurisé pour fonctionner, même sans avoir besoin
  # d'un vrai certificat de confiance publique. D'où un certificat auto-signé
  # ici aussi pour budget.home.test, jamais un certificat Let's Encrypt (pas
  # de sous-domaine DuckDNS pour ce service, cf. _plan/architecture.md).
  cert-init:
    image: alpine:3.20
    profiles: ["init"]
    volumes:
      - certs:/certs
    environment:
      LOCAL_TEST_HOSTNAME: "${LOCAL_TEST_HOSTNAME:-edge.home.test}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        generate() {
          hostname="$$1"
          dir="$$2"
          if [ -f "/certs/$$dir/fullchain.pem" ] && [ -f "/certs/$$dir/privkey.pem" ]; then
            echo "Certificat pour $$hostname déjà présent (/certs/$$dir), rien à faire."
            return 0
          fi
          mkdir -p "/certs/$$dir"
          openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
            -keyout "/certs/$$dir/privkey.pem" -out "/certs/$$dir/fullchain.pem" \
            -subj "/CN=$$hostname" \
            -addext "subjectAltName=DNS:$$hostname"
          chmod 644 "/certs/$$dir/fullchain.pem" "/certs/$$dir/privkey.pem"
          echo "Certificat auto-signé généré pour $$hostname (/certs/$$dir)"
        }
        generate "$${LOCAL_TEST_HOSTNAME}" "_test"
        generate "budget.home.test" "budget"

volumes:
  certs:
  acme_state:
