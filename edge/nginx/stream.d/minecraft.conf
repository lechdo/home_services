# Routage du port de jeu Minecraft (édition Java, TCP 25565) — voir
# minecraft/CLAUDE.md pour le contexte complet (deux surfaces réseau
# distinctes : ce fichier gère uniquement le port de jeu, le panel de
# gestion HTTPS est routé normalement via conf.d/minecraft-panel.conf).
#
# Pas de terminaison TLS ici (le protocole du jeu n'en a pas la notion) et
# pas de page d'erreur possible si le backend ne répond pas (pas de HTTP) :
# un client Minecraft dont le serveur est arrêté voit simplement un échec de
# connexion natif — comportement attendu, pas un défaut à corriger.
#
# Même raisonnement de timeout court que les blocs HTTP des services hébergés
# sur ce second serveur (paperless.conf, actual-budget.conf) : le conteneur
# du serveur Minecraft peut être arrêté (piloté par le panel) sans que la
# machine hôte (192.168.1.109) elle-même ne soit éteinte.
server {
    listen 25565;
    listen [::]:25565;
    proxy_pass 192.168.1.109:25565;
    proxy_connect_timeout 3s;
}
