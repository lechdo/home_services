<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Panel Minecraft indisponible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 28rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 1.4rem; margin-top: 0; }
    p { line-height: 1.5; color: #444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Le panel Minecraft est temporairement indisponible</h1>
    <p>Le serveur qui héberge le panel de gestion ne répond pas. Réessayez dans quelques minutes, ou contactez Julien. (Ceci ne concerne que le site de gestion — pas le serveur de jeu lui-même.)</p>
  </div>
</body>
</html>
