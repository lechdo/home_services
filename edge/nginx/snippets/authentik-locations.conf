# Snippet réutilisable (authentik/_plan/plan.md phase 3) : à inclure comme
# location {} sœurs, directement dans le server{} d'un service protégé (pas
# à l'intérieur d'un autre location). Fournit le point de vérification
# interne utilisé par auth_request (authentik-location.conf) et la
# redirection vers l'écran de login centralisé (auth.jvince.dynv6.net,
# mode "forward auth (domain level)" - session partagée entre tous les
# sous-domaines qui incluent ce même snippet, pas de reconnexion par
# service).
location /outpost.goauthentik.io/auth/nginx {
    internal;
    proxy_pass http://192.168.1.109:8089/outpost.goauthentik.io/auth/nginx;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 https://auth.jvince.dynv6.net/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}
