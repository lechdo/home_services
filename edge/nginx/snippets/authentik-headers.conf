# Snippet réutilisable (authentik/_plan/plan.md phase 3) : à inclure dans le
# même "location /" qu'authentik-location.conf, au niveau des autres
# proxy_set_header (avant ou après, l'ordre entre proxy_set_header
# n'a pas d'importance) — transmet l'identité de l'utilisateur authentifié
# au backend. Optionnel pour le backend (peut être ignoré sans casser
# quoi que ce soit), mais disponible si un service veut s'en servir plus tard.
proxy_set_header X-authentik-username $authentik_username;
proxy_set_header X-authentik-groups $authentik_groups;
proxy_set_header X-authentik-email $authentik_email;
proxy_set_header X-authentik-name $authentik_name;
proxy_set_header X-authentik-uid $authentik_uid;
