user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}

# Bloc stream (proxy L4, TCP/UDP brut) — reprise fidèle du nginx.conf par
# défaut de l'image nginx:1.27-alpine ci-dessus (rien retiré du bloc http),
# avec ce bloc stream en plus, ajouté pour router le port de jeu Minecraft
# (protocole binaire propriétaire, pas du HTTP — un reverse-proxy L7 comme le
# bloc http ci-dessus ne peut pas router ce trafic). Contrairement à
# `conf.d/*.conf` (HTTP, terminaison TLS incluse), `stream.d/*.conf` ne fait
# que relayer du TCP brut, sans TLS : le client Minecraft se connecte
# directement en clair (le protocole du jeu n'a pas de notion de TLS), edge
# ne fait ici qu'un forward de port. Premier usage de ce module dans ce
# dépôt — voir edge/_plan/plan.md et minecraft/CLAUDE.md.
stream {
    include /etc/nginx/stream.d/*.conf;
}
