# Enregistrement du service authentik (authentik/_plan/plan.md, phase 2).
# Sert à la fois l'interface web (login, admin) et l'outpost embarqué —
# ce même bloc recevra en Phase 3 le location interne
# "/outpost.goauthentik.io/auth/nginx" utilisé par les auth_request des
# autres services protégés (rien de spécifique à ce stade, contrat standard).
#
# authentik publie son port HTTP sur l'IP LAN de son second serveur dédié
# (192.168.1.109:8089, comme paperless/actual-budget/minecraft/music_manager)
# ; edge n'a besoin de rien d'autre pour le router (contrat d'intégration
# standard, cf. edge/_plan/architecture.md).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.jvince.dynv6.net;

    ssl_certificate     /etc/nginx/certs/auth/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/auth/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://192.168.1.109:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bug réel constaté (2026-08-24) : l'interface authentik ouvre un
        # WebSocket (wss://auth.jvince.dynv6.net/ws/client/, notifications en
        # direct) — sans ces en-têtes, la bascule échoue silencieusement
        # (juste une erreur en console navigateur, rien de bloquant pour
        # l'auth elle-même, mais autant corriger). Sans effet sur les
        # requêtes HTTP normales (n'agit que si le client demande "Upgrade").
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
