# Enregistrement du service paperless (edge/_plan/plan.md, phase 6).
# paperless-ngx publie son webserver en HTTP sur 127.0.0.1:8082 ; edge n'a
# besoin de rien d'autre pour le router (contrat d'intégration, cf.
# _plan/architecture.md).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperless-jvince.duckdns.org;

    ssl_certificate     /etc/nginx/certs/paperless-jvince/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/paperless-jvince/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
