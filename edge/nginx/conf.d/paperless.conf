# Enregistrement du service paperless (edge/_plan/plan.md, phase 7).
# paperless-ngx publie son webserver en HTTP sur l'IP LAN de son second
# serveur dédié (192.168.1.109:8082, réservation DHCP) ; edge n'a besoin de
# rien d'autre pour le router (contrat d'intégration, cf. _plan/architecture.md
# — atteindre une IP LAN distante fonctionne identiquement à 127.0.0.1,
# network_mode: host donnant déjà accès à tout le réseau local de l'hôte).
#
# Ancien sous-domaine DuckDNS (paperless-jvince.duckdns.org) retiré
# (edge/_plan/plan.md phase 15, migration terminée 2026-08-24) — dynv6 est
# désormais l'unique mécanisme DNS/certificat de ce dépôt.
#
# Forward-auth (Phase 4 d'authentik) retiré aussi (2026-08-24,
# authentik/_plan/plan.md phase 6) : devenu redondant depuis que paperless
# gère sa propre authentification via OIDC (login local désactivé,
# PAPERLESS_DISABLE_REGULAR_LOGIN=true) — corrigeait au passage un blocage
# CORS réel sur le manifest PWA (requête sans cookie, interceptée par le
# portail avant d'atteindre paperless).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperless.jvince.dynv6.net;

    ssl_certificate     /etc/nginx/certs/paperless/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/paperless/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Ce second serveur n'est pas allumé en permanence (choix assumé, cf.
    # paperless/_plan/plan.md phase 9) : proxy_connect_timeout court pour ne
    # pas faire attendre ~60-75s (timeout TCP par défaut du noyau) quand la
    # machine est éteinte (SYN sans réponse, contrairement à un service
    # arrêté mais machine allumée qui refuserait la connexion immédiatement).
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /_edge/paperless-unavailable.html;

    location / {
        proxy_pass http://192.168.1.109:8082;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bug réel constaté (2026-08-24, même famille que authentik.conf) :
        # paperless ouvre un WebSocket pour le statut de traitement en direct
        # (wss://paperless.jvince.dynv6.net/ws/status/) — sans ces en-têtes,
        # la bascule échoue silencieusement. Sans effet sur les requêtes HTTP
        # normales (n'agit que si le client demande "Upgrade").
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Page d'indisponibilité dédiée (usage familial, cf. plan.md phase 7) :
    # servie localement par edge, aucun appel réseau supplémentaire. `internal`
    # empêche un client d'y accéder directement hors du mécanisme error_page.
    location = /_edge/paperless-unavailable.html {
        internal;
        alias /etc/nginx/error-pages/paperless-unavailable.html;
        add_header Retry-After 300 always;
    }
}
