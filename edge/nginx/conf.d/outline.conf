# Enregistrement du service outline (outline/_plan/plan.md phase 2). outline
# publie son port en HTTP sur 192.168.1.109:8090 ; edge n'a besoin de rien
# d'autre pour le router (contrat d'intégration standard,
# _plan/architecture.md).
#
# WebSocket ajouté d'emblée (Upgrade/Connection) : outline utilise une
# connexion temps réel pour l'édition collaborative des documents — même
# bug que celui trouvé sur authentik.conf (notifications), anticipé ici
# plutôt que découvert en prod. À confirmer/retirer si le test réel montre
# que ce n'est pas nécessaire.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name doc.jvince.dynv6.net;

    ssl_certificate     /etc/nginx/certs/doc/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/doc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://192.168.1.109:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
