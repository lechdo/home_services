# Bloc par défaut (Phase 0, sans DuckDNS) : sert le certificat auto-signé
# généré par cert-init, et répond par un texte simple pour confirmer que le
# reverse-proxy fonctionne. Reste actif même une fois des services réels
# routés (server_name "_" ne matche que les requêtes dont le Host ne
# correspond à aucun bloc dédié ci-dessous) — utile comme diagnostic si un
# sous-domaine est mal configuré côté DNS.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/_test/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/_test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain;
        return 200 "edge: reverse-proxy operationnel, aucun service backend ne correspond a ce nom d'hote.\n";
    }
}
