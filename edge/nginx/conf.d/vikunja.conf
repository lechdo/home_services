# Enregistrement du service vikunja (edge/_plan/plan.md phase 11, vikunja/_plan/plan.md
# phase 3b). vikunja publie son port en HTTP sur 127.0.0.1:8084 ; edge n'a
# besoin de rien d'autre pour le router (contrat d'intégration standard,
# _plan/architecture.md).
#
# Ancien sous-domaine DuckDNS (task-jvince.duckdns.org) retiré
# (edge/_plan/plan.md phase 15, migration terminée 2026-08-24) — dynv6 est
# désormais l'unique mécanisme DNS/certificat de ce dépôt.
#
# Forward-auth (Phase 4 d'authentik) retiré aussi (2026-08-23,
# authentik/_plan/plan.md phase 6) : devenu redondant depuis que vikunja
# gère sa propre authentification via OIDC (login local désactivé côté
# vikunja, VIKUNJA_AUTH_LOCAL_ENABLED=false) — un seul prompt authentik au
# lieu de deux (le portail d'accès générique + le bouton OIDC applicatif).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name task.jvince.dynv6.net;

    ssl_certificate     /etc/nginx/certs/task/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/task/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
