# Enregistrement du panel de gestion Minecraft (démarrer/arrêter le serveur,
# changer de map) — le serveur de jeu lui-même (port 25565) est routé à part,
# voir stream.d/minecraft.conf, car ce n'est pas du HTTP.
#
# panel publie son port HTTP sur l'IP LAN du second serveur physique
# (192.168.1.109:8086, même hôte que le futur conteneur du serveur
# Minecraft) — contrat d'intégration standard (_plan/architecture.md).
#
# Exposition publique complète dès la création (sous-domaine DuckDNS +
# Let's Encrypt), pas de passage préalable par le mode local uniquement : le
# sous-domaine minecraft-jvince.duckdns.org a été fourni directement par
# l'utilisateur (2026-08-17).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minecraft-jvince.duckdns.org;

    ssl_certificate     /etc/nginx/certs/minecraft-jvince/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/minecraft-jvince/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Le second serveur reste allumé en permanence pour ce service
    # (décision 2026-08-17, minecraft/CLAUDE.md — à la différence de
    # paperless/actual-budget) : cette page ne devrait donc servir qu'en cas
    # de panne réelle (conteneur panel arrêté, hôte redémarré), pas comme
    # état attendu régulier. Même mécanisme réutilisé malgré tout (demande
    # explicite : "une redirection avec page serveur éteint comme les autres
    # services").
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /_edge/minecraft-panel-unavailable.html;

    location / {
        proxy_pass http://192.168.1.109:8086;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_edge/minecraft-panel-unavailable.html {
        internal;
        alias /etc/nginx/error-pages/minecraft-panel-unavailable.html;
        add_header Retry-After 300 always;
    }
}

# Redirection HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name minecraft-jvince.duckdns.org;
    return 301 https://$host$request_uri;
}
