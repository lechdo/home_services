# Enregistrement du panel de gestion Minecraft (démarrer/arrêter le serveur,
# changer de map) — le serveur de jeu lui-même (port 25565) est routé à part,
# voir stream.d/minecraft.conf, car ce n'est pas du HTTP.
#
# panel publie son port HTTP sur l'IP LAN du second serveur physique
# (192.168.1.109:8086, même hôte que le futur conteneur du serveur
# Minecraft) — contrat d'intégration standard (_plan/architecture.md).
#
# Ancien sous-domaine DuckDNS (minecraft-jvince.duckdns.org) retiré
# (edge/_plan/plan.md phase 15, migration terminée 2026-08-24) — dynv6 est
# désormais l'unique mécanisme DNS/certificat de ce dépôt.
#
# Protégé par authentik (authentik/_plan/plan.md phase 4) — uniquement ce
# panel HTTP ; forward-auth est un mécanisme HTTP, inapplicable au port de
# jeu (cf. authentik/CLAUDE.md), qui reste routé séparément et sans
# authentification via stream.d/minecraft.conf, inchangé.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minecraft.jvince.dynv6.net;

    ssl_certificate     /etc/nginx/certs/minecraft/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/minecraft/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Le second serveur reste allumé en permanence pour ce service
    # (décision 2026-08-17, minecraft/CLAUDE.md — à la différence de
    # paperless/actual-budget) : cette page ne devrait donc servir qu'en cas
    # de panne réelle (conteneur panel arrêté, hôte redémarré), pas comme
    # état attendu régulier. Même mécanisme réutilisé malgré tout (demande
    # explicite : "une redirection avec page serveur éteint comme les autres
    # services").
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /_edge/minecraft-panel-unavailable.html;

    location / {
        include /etc/nginx/snippets/authentik-location.conf;

        proxy_pass http://192.168.1.109:8086;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/authentik-headers.conf;
    }

    location = /_edge/minecraft-panel-unavailable.html {
        internal;
        alias /etc/nginx/error-pages/minecraft-panel-unavailable.html;
        add_header Retry-After 300 always;
    }

    include /etc/nginx/snippets/authentik-locations.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name minecraft.jvince.dynv6.net;
    return 301 https://$host$request_uri;
}
