# Enregistrement du service bitwarden (migration depuis son ancien
# sidecar-acme/sidecar-ddns propre, cf. bitwarden/_plan/plan-migration-edge.md).
# bitwarden publie son reverse-proxy interne en HTTP sur 127.0.0.1:8081 ;
# edge n'a besoin de rien d'autre pour le router.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jvince.duckdns.org;

    ssl_certificate     /etc/nginx/certs/jvince/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/jvince/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 525M;

    location /notifications/hub {
        proxy_pass http://127.0.0.1:8081/notifications/hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
