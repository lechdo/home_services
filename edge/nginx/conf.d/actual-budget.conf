# Enregistrement du service actual-budget — mode local uniquement, avec
# certificat AUTO-SIGNÉ (pas de sous-domaine DuckDNS, pas de Let's Encrypt).
# Contrairement à bitwarden/paperless, ce bloc ne fait PAS partie de la table
# de routage HTTPS/DuckDNS habituelle (_plan/architecture.md) : pas de
# dépendance à sidecar-acme/sidecar-ddns pour ce service.
#
# Correction du 2026-08-13 (voir _plan/architecture.md et compose.yaml,
# cert-init) : un premier essai en HTTP simple (sans certificat) provoquait
# une erreur fatale côté Actual ("Actual a besoin de l'accès à
# SharedArrayBuffer") — un navigateur ne traite HTTP comme "contexte
# sécurisé" que sur localhost/127.0.0.1, jamais sur un autre nom d'hôte même
# purement local. D'où ce certificat auto-signé, généré par cert-init,
# uniquement pour satisfaire cette exigence du navigateur — pas pour une
# vraie confiance publique (le navigateur affichera un avertissement à
# accepter une fois par appareil, attendu et sans conséquence ici).
#
# Accès : https://budget.home.test/ depuis un appareil du réseau local, à
# condition d'avoir une entrée dans son /etc/hosts (ou équivalent) pointant
# ce nom vers l'IP LAN de la machine qui héberge edge — rien de tel n'est
# encore automatisé ici (pas de DNS local dans ce dépôt). Faute de cette
# entrée, https://<IP-LAN-edge>/ fonctionne identiquement : c'est le seul
# bloc "listen 443" avec ce server_name, donc nginx s'en sert par défaut
# pour tout Host qui ne correspond à aucun autre bloc HTTPS enregistré.
#
# actual-budget publie désormais son port en HTTP sur l'IP LAN de son second
# serveur dédié (192.168.1.109:8083, migration _plan/plan.md phase 5 côté
# actual-budget / phase 10 côté edge, 2026-08-14) ; edge n'a besoin de rien
# d'autre pour le router (contrat d'intégration standard, _plan/architecture.md
# — atteindre une IP LAN distante fonctionne identiquement à 127.0.0.1,
# network_mode: host donnant déjà accès à tout le réseau local de l'hôte).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name budget.home.test;

    ssl_certificate     /etc/nginx/certs/budget/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/budget/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Correction du 2026-08-13 : la limite par défaut de nginx (1M) rejetait
    # en 413 le payload complet de POST /sync/sync (~3,3 Mo et croissant avec
    # l'historique du budget), ce qui bloquait silencieusement toute
    # synchronisation — les changements faits dans le navigateur (ex. comptes
    # créés par erreur) restaient coincés localement, jamais visibles côté
    # serveur/API. Valeur reprise des recommandations officielles Actual pour
    # un reverse-proxy nginx.
    client_max_body_size 20M;

    # Ce second serveur n'est pas allumé en permanence (choix assumé,
    # décision explicite du 2026-08-14, même modèle que paperless) :
    # proxy_connect_timeout court pour ne pas faire attendre ~60-75s (timeout
    # TCP par défaut du noyau) quand la machine est éteinte (SYN sans
    # réponse, contrairement à un service arrêté mais machine allumée qui
    # refuserait la connexion immédiatement).
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /_edge/actual-unavailable.html;

    location / {
        proxy_pass http://192.168.1.109:8083;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Page d'indisponibilité dédiée (usage familial) : servie localement par
    # edge, aucun appel réseau supplémentaire. `internal` empêche un client
    # d'y accéder directement hors du mécanisme error_page.
    location = /_edge/actual-unavailable.html {
        internal;
        alias /etc/nginx/error-pages/actual-unavailable.html;
        add_header Retry-After 300 always;
    }
}

# Redirection HTTP -> HTTPS : évite qu'un accès en http:// (ancien favori,
# lien tapé sans https://) retombe sur le même problème SharedArrayBuffer.
server {
    listen 80;
    listen [::]:80;
    server_name budget.home.test;
    return 301 https://$host$request_uri;
}
