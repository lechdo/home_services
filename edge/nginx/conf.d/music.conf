# Enregistrement du service music_manager (music_manager/_plan/plan.md phase
# 4). navidrome/fetcher tournent sur le second serveur physique
# (192.168.1.109, comme paperless/actual-budget/minecraft — le Pi n'a pas la
# RAM pour un service de transcodage/téléchargement), navidrome sur le port
# 8087, fetcher sur le port 8088 ; edge n'a besoin de rien d'autre pour les
# router (contrat d'intégration standard, _plan/architecture.md).
#
# Ancien sous-domaine DuckDNS unique (music-jvince.duckdns.org, routage par
# chemin /navidrome/ + /fetcher/ — exception documentée dans
# edge/_plan/architecture.md) retiré (edge/_plan/plan.md phase 15, migration
# terminée 2026-08-24) au profit d'un sous-domaine dynv6 par composant
# (navi/music ci-dessous) — dynv6 rend les sous-domaines multiples triviaux,
# le motif d'origine de l'exception n'a plus besoin de cette contrepartie
# technique. Revient au contrat standard un-sous-domaine-par-composant.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name navi.jvince.dynv6.net;

    ssl_certificate     /etc/nginx/certs/navi/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/navi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # API Subsonic (app mobile Symfonium, authentik/_plan/plan.md phase 6,
    # décision 4) : jamais derrière le portail forward-auth, elle a sa
    # propre authentification par requête (BasicAuth ou paramètres u/p/t/s)
    # que navidrome continue de gérer nativement — une redirection HTML vers
    # un écran de login SSO casserait ce client, qui ne sait pas la suivre.
    location /rest/ {
        proxy_pass http://192.168.1.109:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Interface web uniquement : protégée par le portail générique
    # (authentik/_plan/plan.md phase 4), avec l'identité transmise à
    # navidrome via son mécanisme "Externalized Authentication" (en-tête de
    # confiance, pas d'OIDC dédié ici) — cf. music_manager/compose.yaml pour
    # les ND_EXTAUTH_* correspondants et l'avertissement sécurité sur
    # l'IP source de confiance.
    location / {
        include /etc/nginx/snippets/authentik-location.conf;

        proxy_pass http://192.168.1.109:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User $authentik_username;
        include /etc/nginx/snippets/authentik-headers.conf;
    }

    include /etc/nginx/snippets/authentik-locations.conf;
}

# fetcher, servi à la racine de son propre sous-domaine (plus de préfixe
# /fetcher/ ni de X-Forwarded-Prefix à envoyer, propres à l'ancien routage
# par chemin DuckDNS ci-dessus, retiré).
#
# Protégé par authentik (authentik/_plan/plan.md phase 4, décision 5) —
# malgré son authentification interne déjà existante (compte + mot de passe,
# music_manager/CLAUDE.md), qui reste en place en second niveau sans
# conflit. navi.jvince.dynv6.net (navidrome) ci-dessus reste volontairement
# NON protégé sur son API (décision 4 — API Subsonic/app mobile incompatible
# avec une redirection HTML vers un écran de login SSO).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name music.jvince.dynv6.net;

    ssl_certificate     /etc/nginx/certs/music/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/music/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/snippets/authentik-location.conf;

        proxy_pass http://192.168.1.109:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/authentik-headers.conf;
    }

    include /etc/nginx/snippets/authentik-locations.conf;
}
