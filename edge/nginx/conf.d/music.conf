# Enregistrement du service music_manager (music_manager/_plan/plan.md phase
# 4). Cas particulier documenté dans music_manager/CLAUDE.md : un seul
# sous-domaine pour DEUX composants d'un même service (navidrome + fetcher),
# donc un seul server{} avec deux location{} au lieu d'un server_name par
# composant — exception explicite à la règle habituelle d'edge (un
# sous-domaine par SERVICE backend, jamais par composant interne d'un même
# service), voir edge/_plan/architecture.md.
#
# navidrome/fetcher tournent sur le second serveur physique (192.168.1.109,
# comme paperless/actual-budget/minecraft — le Pi n'a pas la RAM pour un
# service de transcodage/téléchargement), navidrome sur le port 8087,
# fetcher sur le port 8088 ; edge n'a besoin de rien d'autre pour les router
# (contrat d'intégration standard, _plan/architecture.md).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name music-jvince.duckdns.org;

    ssl_certificate     /etc/nginx/certs/music-jvince/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/music-jvince/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Navidrome connaît nativement son sous-chemin (ND_BASEURL=/navidrome,
    # music_manager/compose.yaml) : rien à retirer/réécrire ici, un simple
    # proxy_pass suffit (music_manager/_plan/plan.md phase 2).
    location /navidrome/ {
        proxy_pass http://192.168.1.109:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # fetcher (Flask) ne connaît pas nativement son sous-chemin, contrairement
    # à navidrome : contrairement à ce que ce fichier faisait initialement
    # (constaté réellement en testant — 404, Flask ne route que "/login", pas
    # "/fetcher/login"), il faut RETIRER le préfixe avant de transmettre la
    # requête (slash final sur proxy_pass) ET dire à Flask ce préfixe via
    # X-Forwarded-Prefix (lu par ProxyFix, fetcher/app.py) pour qu'il génère
    # malgré tout des redirections/liens corrects vers /fetcher/... côté
    # navigateur. Les deux sont nécessaires ensemble (music_manager/_plan/plan.md
    # phase 3).
    location /fetcher/ {
        proxy_pass http://192.168.1.109:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /fetcher;
    }
}
