services:
  # broker : file de tâches (OCR, indexation, matching Auto) — nécessaire
  # même en usage mono-utilisateur, Paperless-ngx ne fonctionne pas sans.
  # Non anticipé dans _plan/architecture.md (conception centrée sur
  # PostgreSQL) : découvert à l'implémentation, cf. _plan/plan.md phase 0.
  broker:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  # webserver : ne termine jamais le TLS et ne gère aucun DNS — exposition
  # Internet éventuelle déléguée au service `edge` (contrat d'intégration,
  # cf. ../edge/_plan/architecture.md et CLAUDE.md, "Exposition Internet").
  paperless:
    # ghcr.io/paperless-ngx/paperless-ngx (registre "canonique" de la doc
    # officielle) refuse le pull dans cet environnement de test ("denied") ;
    # docker.io/paperlessngx/paperless-ngx est le même projet, publié en
    # mirroir sur Docker Hub — utilisé ici pour cette raison pratique.
    image: paperlessngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: "${POSTGRES_PASSWORD}"
      PAPERLESS_SECRET_KEY: "${PAPERLESS_SECRET_KEY}"
      PAPERLESS_TIME_ZONE: "${PAPERLESS_TIME_ZONE:-UTC}"
      # Règle ALLOWED_HOSTS + CORS_ALLOWED_HOSTS + CSRF_TRUSTED_ORIGINS en une
      # variable (nécessaire derrière un reverse-proxy sur un nom de domaine
      # personnalisé, ici edge).
      PAPERLESS_URL: "https://${PUBLIC_HOSTNAME:-paperless.home.test}"
      PAPERLESS_ADMIN_USER: "${PAPERLESS_ADMIN_USER:-admin}"
      PAPERLESS_ADMIN_PASSWORD: "${PAPERLESS_ADMIN_PASSWORD}"
      PAPERLESS_ADMIN_MAIL: "${PAPERLESS_ADMIN_MAIL:-admin@example.com}"
      # Consommation des fichiers .eml (courriers électroniques) déposés dans
      # consume/ : Paperless-ngx délègue le rendu HTML->PDF à Gotenberg et
      # l'extraction du message à Tika ; sans ces deux endpoints, un .eml
      # échoue à la consommation ("Unsupported mime type message/rfc822").
      PAPERLESS_TIKA_ENABLED: "true"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      # SSO applicatif via authentik (authentik/_plan/plan.md phase 6). Le
      # compte authentik "julien" a été lié en base au compte "Julien"
      # existant (superuser) — /accounts/3rdparty/ n'existant pas dans cette
      # version de paperless-ngx, la liaison a dû se faire manuellement
      # (créer un compte temporaire via OIDC, réassigner son SocialAccount
      # au compte admin existant, supprimer le temporaire). Validé
      # réellement (2026-08-24) avant de couper le login local ci-dessous.
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect": {"APPS": [{"provider_id": "authentik", "name":
        "authentik", "client_id": "paperless", "secret":
        "${PAPERLESS_OIDC_CLIENT_SECRET}", "settings": {"server_url":
        "https://auth.jvince.dynv6.net/application/o/paperless/.well-known/openid-configuration"}}]}}
      # Bascule finale (2026-08-24, décision explicite de l'utilisateur,
      # même schéma que vikunja) : login local désactivé, redirection
      # automatique vers authentik dès l'écran de login (pas de bouton à
      # cliquer) — cohérent avec le retrait du portail générique (forward-
      # auth) côté edge, devenu redondant ET responsable d'un blocage CORS
      # sur le manifest PWA (requête sans cookie, interceptée par le
      # portail avant d'atteindre paperless).
      PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    ports:
      - "192.168.1.109:8082:8000"
    networks:
      - internal
    extra_hosts:
      # Même bug que vikunja (authentik/_plan/plan.md phase 6, 2026-08-23) :
      # ce conteneur, sur un réseau bridge Docker sans IPv6 sortant, ne peut
      # pas joindre auth.jvince.dynv6.net publiquement ("Network is
      # unreachable" constaté réellement, erreur 500 sur /accounts/oidc/...).
      # Résolu directement vers edge (le Pi, qui gère le TLS pour ce nom) —
      # jamais "host-gateway" (piège confirmé sur vikunja : résout vers la
      # passerelle du réseau bridge Docker PAR DÉFAUT, pas celle du réseau
      # personnalisé réellement utilisé par ce conteneur).
      - "auth.jvince.dynv6.net:192.168.1.99"

  # gotenberg : rendu HTML/office -> PDF, utilisé par paperless (via Tika)
  # pour convertir le corps d'un .eml en PDF avant OCR/indexation. Jamais
  # exposé sur l'hôte : appelé uniquement par paperless sur le réseau interne.
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.34
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - internal

  # tika : extraction du contenu des fichiers "Office" et des e-mails (.eml)
  # pour le compte de paperless. Jamais exposé sur l'hôte.
  tika:
    image: docker.io/apache/tika:latest
    restart: unless-stopped
    networks:
      - internal

  # rad-lad-service : squelette du service d'orchestration/intelligence
  # (Phase 3, cf. _plan/plan.md). Reçoit le webhook du workflow Paperless
  # "RAD/LAD - notification document" (déclaré dans provisioning/seed.json) à
  # l'ajout/modification d'un document, et relit ce document (dont son texte
  # OCR) via l'API Paperless — ne classe/n'extrait encore rien (Phase 4+).
  # Jamais exposé sur l'hôte : seul Paperless (réseau interne) l'appelle.
  rad-lad-service:
    build: ./rad-lad
    restart: unless-stopped
    depends_on:
      - paperless
    environment:
      PAPERLESS_BASE_URL: http://paperless:8000
      PAPERLESS_ADMIN_USER: "${PAPERLESS_ADMIN_USER:-admin}"
      PAPERLESS_ADMIN_PASSWORD: "${PAPERLESS_ADMIN_PASSWORD}"
    networks:
      - internal

  # sidecar-gdrive-sync : synchronisation unidirectionnelle Google Drive ->
  # consume (Phase 1, cf. _plan/plan.md et _plan/architecture.md). Ne supprime
  # jamais rien côté Drive (immutabilité de la source).
  # Bug découvert à l'usage (2026-08-14, voir _plan/plan.md phase 1) : un
  # simple `rclone copy` n'a aucune mémoire de ce qu'il a déjà envoyé une fois
  # que Paperless retire le fichier de consume/ après ingestion — au cycle
  # suivant, le fichier est toujours présent sur Drive (immuable) et absent de
  # consume/, donc recopié, et Paperless en crée un **nouveau document** à
  # chaque fois plutôt que de le rejeter (l'hypothèse initiale que la
  # détection de doublon par hash de Paperless-ngx suffirait à absorber ça
  # sans tracking custom s'est révélée fausse en pratique).
  # Fix : un ledger persistant (/state/synced.tsv, sur un volume séparé de
  # consume/ — jamais vidé par Paperless) mémorise chemin+taille+date de
  # modification de chaque fichier déjà envoyé une fois ; un fichier qui
  # réapparaît à l'identique n'est plus jamais recopié. Une modification
  # réelle du fichier source (taille/date différentes) est toujours
  # resynchronisée normalement.
  sidecar-gdrive-sync:
    image: alpine:3.20
    profiles: ["gdrive-sync"]
    restart: unless-stopped
    environment:
      GDRIVE_REMOTE_PATH: "${GDRIVE_REMOTE_PATH}"
      RCLONE_CONFIG: /rclone.conf
    volumes:
      - ./rclone.conf:/rclone.conf:ro
      - ./consume:/consume
      - gdrive-sync-state:/state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache rclone >/dev/null
        STATE_FILE=/state/synced.tsv
        touch "$$STATE_FILE"
        while true; do
          echo "$$(date -u +%FT%TZ) début de la synchronisation depuis $$GDRIVE_REMOTE_PATH"
          rclone lsf --files-only -R --min-age 1m --format pst --separator '|' "$$GDRIVE_REMOTE_PATH" | \
          while IFS='|' read -r path size modtime; do
            [ -z "$$path" ] && continue
            key="$$path|$$size|$$modtime"
            if ! grep -qxF "$$key" "$$STATE_FILE"; then
              echo "  nouveau (ou modifié) : $$path"
              mkdir -p "/consume/$$(dirname "$$path")"
              if rclone copyto "$$GDRIVE_REMOTE_PATH/$$path" "/consume/$$path"; then
                echo "$$key" >> "$$STATE_FILE"
              else
                echo "  échec de copie pour $$path (retenté au prochain cycle)" >&2
              fi
            fi
          done
          echo "$$(date -u +%FT%TZ) synchronisation terminée"
          sleep 300
        done

networks:
  internal:

volumes:
  data:
  media:
  pgdata:
  redisdata:
  gdrive-sync-state:
