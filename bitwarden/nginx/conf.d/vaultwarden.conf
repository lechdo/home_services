server {
    listen 80;
    server_name _;

    # Autorise les pièces jointes volumineuses (recommandation Vaultwarden).
    client_max_body_size 525M;

    # Depuis Vaultwarden 1.31.0, le port 3012 dédié au websocket a été
    # supprimé : la notification hub est servie sur le port HTTP principal
    # (découvert à l'usage lors de la migration vers edge — le proxy_pass vers
    # vaultwarden:3012 échouait, "connection refused", voir
    # _plan/plan-migration-edge.md).
    location /notifications/hub {
        proxy_pass http://vaultwarden:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://vaultwarden:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Le TLS est terminé par edge, pas ici : on relaie tel quel le
        # protocole qu'edge a constaté côté client ($http_x_forwarded_proto),
        # plutôt que $scheme qui vaudrait toujours "http" sur ce saut interne.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
