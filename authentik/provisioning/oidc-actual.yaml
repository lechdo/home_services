version: 1
metadata:
  name: oidc-actual
entries:
  # OAuth2/OpenID Provider dédié à actual-budget (authentik/_plan/plan.md
  # phase 6) — Actual (serveur, version 26.8.1 constatée) supporte l'OIDC
  # nativement (scripts enable-openid.js/disable-openid.js embarqués dans
  # l'image officielle), pas de faux espoir cette fois.
  #
  # Secret régénéré en hexadécimal le 2026-08-24 (voir plan.md) : la
  # première valeur, en base64, contenait "+"/"/" mal encodés dans la
  # requête form-urlencoded du token endpoint côté client Actual
  # ("invalid_client" malgré un secret identique des deux côtés).
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-oidc-actual
    identifiers:
      name: OIDC Actual Budget
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: actual
      client_secret: !Env OIDC_ACTUAL_CLIENT_SECRET
      # Route de callback trouvée dans le code du serveur Actual
      # (account-db-B0u6vCZk.js: redirect_uri = new URL("/openid/callback",
      # server_hostname)) — pas une hypothèse cette fois, lu directement
      # dans le binaire déployé.
      redirect_uris:
        - matching_mode: strict
          url: https://budget.jvince.dynv6.net/openid/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]

  - model: authentik_core.application
    id: app-oidc-actual
    identifiers:
      slug: actual
    attrs:
      name: Actual Budget
      slug: actual
      provider: !KeyOf provider-oidc-actual

  # Restriction d'accès explicite (demande utilisateur, 2026-08-24) : SEUL
  # "julien" doit pouvoir s'authentifier sur cette application, même si
  # d'autres comptes authentik existent pour d'autres services (ex.
  # "virginie" sur paperless). Dès qu'une Application a au moins un binding,
  # authentik bascule en liste blanche : plus aucun autre compte ne
  # correspond, donc plus aucun autre compte ne peut se connecter — en plus
  # (pas à la place) de userCreationMode=manual côté Actual lui-même
  # (défaut, non modifié : le premier login OpenID devient seul propriétaire
  # du serveur, aucune création automatique d'un second compte).
  - model: authentik_policies.policybinding
    id: binding-actual-julien-only
    identifiers:
      target: !KeyOf app-oidc-actual
      user: !Find [authentik_core.user, [username, julien]]
    attrs:
      target: !KeyOf app-oidc-actual
      user: !Find [authentik_core.user, [username, julien]]
      order: 0
      enabled: true
      negate: false
